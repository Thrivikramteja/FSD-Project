version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    volumes:
      - ./Backend:/usr/src/app
      - /usr/src/app/node_modules # Prevents local node_modules from overriding container builds
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=your_super_secret_key
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      - redis

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend